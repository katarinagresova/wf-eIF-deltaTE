# wf-eIF-deltaTE configuration. Paths are relative to the repo root (where
# snakemake is run from). No experiment is hardcoded here: the 10
# (target, timepoint) experiments are derived from config/samples.csv.
# /path/to/ paths are placeholders: set them here, or in an untracked
# config/local/config.yaml, which snakemake.sh and slurm_job.sh layer on top.

samples: "config/samples.csv"
RESULTS_DIR: "results"
LOG_DIR: "logs"

# Timepoints to analyze. The workflow will run the deltaTE analysis for each
# timepoint, using the samples in config/samples.csv that match that timepoint.
timepoints: [4h]

# The two conditions compared (samples.csv `condition`): every experiment needs
# both, and no other, in its Ribo-seq and its RNA-seq libraries. Fold changes
# are treatment over reference.
conditions:
  reference: minusAux
  treatment: plusAux

# wf-riboseq-align, imported once for all experiments (see
# workflow/rules/align.smk) from GitHub at the commit pinned there. To import a
# local checkout instead:
# align_snakefile: "/path/to/wf-riboseq-align/workflow/Snakefile"

# The raw (pre-collapse) HCT116 transcriptome + the external short-read TPM
# reference (workflow/rules/collapse_transcriptome.smk): our own CDS-based
# collapse of these is what align.smk passes on as human_transcriptome_fa
# below, and what rnaseq.smk and ribokit.smk use, not these paths themselves.
collapse_transcriptome:
  raw_fa: "/path/to/raw_human_transcriptome.fa"
  raw_gtf: "/path/to/raw_human_transcriptome.gtf"
  tpm_table: "/path/to/transcript_tpm_short_read.csv"
  # GENCODE's annotation, read only for its readthrough genes (dropped)
  gencode_gtf: "/path/to/gencode.v47.annotation.gtf"
  # then a CDS of which fewer than min_unique_fraction of the k-mers (k = kmer,
  # about a footprint) are in no other CDS merges into the CDS it shares most
  # with (paralogs; the cutoff: validation/reference_fix/)
  kmer: 28
  min_unique_fraction: 0.2

# This block is passed as the `align:` module's own config (its own
# config.yaml shape -- see wf-riboseq-align/config/config.yaml), minus
# `samples`/`RESULTS_DIR`/`LOG_DIR`, which align.smk sets: samples is the
# `samples` above (its `experiment` column splits the experiments). It aligns
# the Ribo-seq only, to the whole (collapsed) transcriptome.
align:
  adapter: "TGGAATTCTCGGGTGCCAAGG"
  minlength: 18
  maxlength: 100
  qualcutoff: 20
  # human_transcriptome_fa: not set here -- collapse_transcriptome.smk builds
  # it from collapse_transcriptome: above, passed in by align.smk
  spike_in_transcriptome_fa: "/path/to/yeast_transcriptome.fa"
  min_spike_in_fraction: 0.01

# The RNA-seq expression filter (workflow/rules/rnaseq.smk), per experiment: a
# transcript is kept if salmon's TPM >= min_tpm in >= min_samples of the
# experiment's RNA-seq libraries, else blacklisted. The blacklist is applied
# when counting (ribokit's GTF, the RNA-seq quants), not to the alignment.
autofilter:
  min_tpm: 0.01
  min_samples: 2

# The Ribo-seq contaminant set: by default the one wf-riboseq-align ships
# (resources/contaminants_built.fa), fetched from GitHub at the commit
# align.smk pins; `align: contaminants_fa: <fasta>` replaces it. Made by its
# build_contaminants rule (needs internet access; see README.md):
# Ensembl 109 human + yeast ncRNA except lncRNA, GtRNAdb hg38 tRNAs, 4 RefSeq
# rRNAs, and 14 index/marker sequences. wf-riboseq-align aligns each read
# once (bowtie, forward-strand only) against one combined index of the
# transcriptome, spike-in and this set, then classifies it by mismatch
# count: a read is kept only if its best alignment is to the transcriptome
# (or spike-in), strictly better than to a contaminant; a tie is dropped.

# The human genome fasta: salmon's decoys (workflow/rules/rnaseq.smk) and
# ribokit's fasta for the human transcriptome GTF (ribokit reads the
# RNA-seq-filtered GTF rnaseq.smk builds per experiment). The spike-in (yeast)
# genome fasta and GTF: ribokit (workflow/rules/ribokit.smk).
references:
  human_genome_fa: "/path/to/human_genome.fa"
  yeast_genome_fa: "/path/to/yeast_genome.fa"
  yeast_gtf: "/path/to/yeast.gtf"

# Ribo-seq read lengths counted, [lo, hi] nt, the same window in every library:
# a window chosen per library can drop a length class at its edge in some
# libraries only, and the spike-in size factors move with it.
read_lengths: [18, 30]

# RNA-seq library correction (workflow/rules/rna_correction.smk). Within each
# condition, each library's log2 CPM deviation from the mean of its replicates
# is fitted as a smooth function of transcript length and GC (median
# regression on natural splines). If the library with the most variable fit
# exceeds max_sd, its counts are divided by the fit and the other libraries
# are refitted, until none exceeds it.
#   max_sd          SD of the log2 fit above which a library is corrected
#   min_mean_count  only transcripts with at least this mean count in the
#                   condition are fitted
#   spline_df       degrees of freedom of each spline (length, GC)
rna_correction:
  max_sd: 0.3
  min_mean_count: 10
  spline_df: 5

# The filtered master table (workflow/rules/master.smk), next to the full one:
# per experiment, a transcript is kept if, in every library of the reference
# condition, its Ribo-seq ritpm >= min_ribo_tpm and its RNA-seq TPM >=
# min_rna_tpm. The Ribo-seq floor is the paper's row filter (wf-transmod-data's
# ribo_tpm_threshold); the RNA-seq floor drops transcripts the RNA-seq barely
# sees (mostly histone mRNAs, which have no poly(A) tail), whose TE is
# meaningless. Applied after DESeq2: padj is the full table's.
master_filter:
  min_ribo_tpm: 5
  min_rna_tpm: 1

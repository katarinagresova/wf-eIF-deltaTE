# workflow/scripts/deseq2.R: DESeq2 and readr. Versions = the eIF pipeline's
# container, docker://ggvillamil/eif (R 4.3.1 / Bioconductor 3.17, read from
# its installed.packages()): R, DESeq2 and the packages it computes with,
# readr and its parser vroom.
channels:
  - conda-forge
  - bioconda

dependencies:
  - r-base=4.3.1
  - bioconductor-deseq2=1.40.2
  - r-locfit=1.5_9.8
  - r-matrixstats=1.1.0
  - r-matrix=1.6_1.1
  - r-readr=2.1.4
  - r-vroom=1.6.4
